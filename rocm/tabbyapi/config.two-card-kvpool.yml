# TabbyAPI: one instance per RX 7900 XTX, both on one shared KV pool (generator/kvpool.py).
# Qwen3.8-27B EXL3 4.00bpw (turboderp) + DFlash2 draft, 114,688-token context, 8-bit KV (draft KV 4-bit).
# Start with rocm/scripts/run_two_cards.sh, which sets the port and card per instance.
network:
  host: 127.0.0.1
  port: 8096                    # replaced per instance by run_two_cards.sh
  disable_auth: true            # set false if the port is reachable from other machines
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: models
  model_name: Qwen3.8-27B-exl3-4.00bpw
  backend: exllamav3
  max_seq_len: 114688
  cache_size: 114688
  cache_mode: Q8
  gpu_split_auto: true
  autosplit_reserve: [512]
  chunk_size: 1024
  max_batch_size: 1
  vision: false
  vision_offload: true
  template_vars_default: {reasoning_effort: low}
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  tool_format: qwen3_coder

draft_model:
  draft_mode: model
  draft_model_dir: models
  draft_model_name: Qwen3.8-27B-DFlash2-EXL3-5.0bpw
  draft_cache_mode: Q4

memory:
  sysmem_recurrent_cache: 4096
  sysmem_kv_cache: 4096         # private CPU tier, used only if the shared pool fails to start

sampling:
  override_preset: qwen38       # Qwen3.8 model-card sampling when a request sends none
